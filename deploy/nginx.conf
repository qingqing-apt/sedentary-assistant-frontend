# 边缘 nginx：只做两件事 —— 发静态文件、把 /api 分流到两个容器。
#
# 这个文件在镜像构建时被拷进 /etc/nginx/conf.d/default.conf，不从宿主机挂载：
# 路由规则和镜像 tag 绑定，回滚镜像时路由一起回滚，不会出现「新配置 + 旧镜像」。
# 唯一挂载的是证书（/etc/nginx/certs，只读），证书永远不进镜像。

upstream sedentary_api {
    server api:8000;
    keepalive 16;
}

upstream sedentary_runtime {
    server runtime:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 容器健康检查打这里，不依赖证书。前面还有一条 301，所以必须精确匹配。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 证书没到位之前，不用明文 HTTP 暴露登录页
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # 对话走 SSE：不能缓冲、不能短超时，否则前端表现为「卡住然后断流」
    location /api/copilotkit {
        proxy_pass http://sedentary_runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 其余 /api 是普通 JSON 接口，回 Python 后端
    location /api/ {
        proxy_pass http://sedentary_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Vite 产物带内容指纹，可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不能缓存，否则发版后用户仍加载旧的资源清单
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
