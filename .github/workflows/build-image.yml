name: build-image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  web:
    name: web build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          load: true
          push: false
          tags: sedentary-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # 镜像里带的是真实的边缘配置：443 要证书、上游是 api/runtime 两个服务名。
      # 所以冒烟也必须按这个前提来跑，否则测的是一个线上不存在的形态。
      - name: 生成自签证书
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/certs/privkey.pem -out /tmp/certs/fullchain.pem \
            -subj "/CN=localhost" 2>/dev/null
          ls -l /tmp/certs

      - name: 启动并按真实路由检查
        run: |
          docker run -d --name web -p 8080:80 -p 8443:443 \
            -v /tmp/certs:/etc/nginx/certs:ro \
            --add-host api:127.0.0.1 --add-host runtime:127.0.0.1 \
            sedentary-web:ci
          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then ok=1; break; fi
            sleep 1
          done
          docker logs web
          if [ "$ok" != "1" ]; then
            echo "::error::nginx 没有在 20s 内起来（多半是 upstream 解析或证书路径）"
            exit 1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          echo "http 状态：$code（期望 301）"
          [ "$code" = "301" ] || { echo "::error::明文 HTTP 没有被跳转到 HTTPS"; exit 1; }

          curl -fsSk https://127.0.0.1:8443/ | grep -q 'id="root"'
          curl -fsSk https://127.0.0.1:8443/some/deep/route | grep -q 'id="root"'
          echo "https 首页与 SPA 回退正常"

          # 后端不存在时 /api 应该是 502（说明确实转给了上游），而不是 404（说明路由没配上）
          api_code=$(curl -s -o /dev/null -w '%{http_code}' -k https://127.0.0.1:8443/api/health)
          echo "/api/health 状态：$api_code（期望 502，上游未启动）"
          [ "$api_code" = "502" ] || { echo "::error::/api 没有转发到 api 上游"; exit 1; }

      # 冒烟通过才推送：推上去的镜像一定是跑起来过的那个
      - name: 记录版本标签
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: 登录镜像仓库
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 推送镜像
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/sedentary-web
        run: |
          sha_tag="sha-$(git rev-parse --short=7 HEAD)"
          docker tag sedentary-web:ci "$IMAGE:$sha_tag"
          docker push "$IMAGE:$sha_tag"
          docker tag sedentary-web:ci "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"

  runtime:
    name: runtime build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime
          load: true
          push: false
          tags: sedentary-runtime:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      # 后端不在，Runtime 也应该起得来（AGENT_URL 是延迟连接）
      - name: 启动并等待健康
        run: |
          docker run -d --name runtime -p 3000:3000 sedentary-runtime:ci
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' runtime)
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          docker logs runtime
          if [ "$status" != "healthy" ]; then
            echo "::error::Runtime 健康检查未通过（当前 $status）"
            exit 1
          fi

      # 冒烟通过才推送：推上去的镜像一定是跑起来过的那个
      - name: 记录版本标签
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: 登录镜像仓库
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 推送镜像
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/sedentary-runtime
        run: |
          sha_tag="sha-$(git rev-parse --short=7 HEAD)"
          docker tag sedentary-runtime:ci "$IMAGE:$sha_tag"
          docker push "$IMAGE:$sha_tag"
          docker tag sedentary-runtime:ci "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
