name: build-image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  web:
    name: web build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          load: true
          push: false
          tags: sedentary-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 启动并检查首页
        run: |
          docker run -d --name web -p 8080:80 sedentary-web:ci
          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then
              ok=1
              break
            fi
            sleep 1
          done
          curl -sI http://127.0.0.1:8080/ | head -3 || true
          docker logs web
          if [ "$ok" != "1" ]; then
            echo "::error::nginx 起来了但首页返回失败"
            exit 1
          fi

      # 冒烟通过才推送：推上去的镜像一定是跑起来过的那个
      - name: 记录版本标签
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: 登录镜像仓库
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 推送镜像
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/sedentary-web
        run: |
          sha_tag="sha-$(git rev-parse --short=7 HEAD)"
          docker tag sedentary-web:ci "$IMAGE:$sha_tag"
          docker push "$IMAGE:$sha_tag"
          docker tag sedentary-web:ci "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"

  runtime:
    name: runtime build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime
          load: true
          push: false
          tags: sedentary-runtime:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      # 后端不在，Runtime 也应该起得来（AGENT_URL 是延迟连接）
      - name: 启动并等待健康
        run: |
          docker run -d --name runtime -p 3000:3000 sedentary-runtime:ci
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' runtime)
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          docker logs runtime
          if [ "$status" != "healthy" ]; then
            echo "::error::Runtime 健康检查未通过（当前 $status）"
            exit 1
          fi

      # 冒烟通过才推送：推上去的镜像一定是跑起来过的那个
      - name: 记录版本标签
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: 登录镜像仓库
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 推送镜像
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/sedentary-runtime
        run: |
          sha_tag="sha-$(git rev-parse --short=7 HEAD)"
          docker tag sedentary-runtime:ci "$IMAGE:$sha_tag"
          docker push "$IMAGE:$sha_tag"
          docker tag sedentary-runtime:ci "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
